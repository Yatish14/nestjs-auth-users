# Credentials come from .env (Compose loads it automatically for ${...} substitution).
# Only the host/port differ from local dev: inside Compose the database is the `postgres` service.
x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?DB_USER must be set in .env}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
  DB_NAME: ${DB_NAME:?DB_NAME must be set in .env}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations, then exits. The app waits for it to succeed.
  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: production
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *db-env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
